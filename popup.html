<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-main: #f8f9fa;
      --bg-card: #ffffff;
      --bg-hover: #f1f3f5;
      --border-color: #dee2e6;
      --border-input: #ced4da;
      --text-primary: #212529;
      --text-heading: #343a40;
      --text-secondary: #6c757d;
      --btn-clear-bg: #6c757d;
      --btn-clear-hover: #5a6268;
      --btn-primary-bg: linear-gradient(135deg, #007bff, #0056b3);
      --btn-primary-hover: linear-gradient(135deg, #0056b3, #004085);
      --btn-primary-shadow: rgba(0, 123, 255, 0.3);
      --input-focus-border: #007bff;
      --input-focus-shadow: rgba(0, 123, 255, 0.15);
      --accent-color: #007bff;
    }

    [data-theme="dark"] {
      --bg-main: #18191a;
      --bg-card: #242526;
      --bg-hover: #333538;
      --border-color: #383a3d;
      --border-input: #44474b;
      --text-primary: #e4e6eb;
      --text-heading: #ffffff;
      --text-secondary: #b0b3b8;
      --btn-clear-bg: #44474b;
      --btn-clear-hover: #55585d;
      --btn-primary-bg: linear-gradient(135deg, #2563eb, #1d4ed8);
      --btn-primary-hover: linear-gradient(135deg, #1d4ed8, #1e40af);
      --btn-primary-shadow: rgba(37, 99, 235, 0.35);
      --input-focus-border: #3b82f6;
      --input-focus-shadow: rgba(59, 130, 246, 0.25);
      --accent-color: #3b82f6;
    }

    [data-theme="oled"] {
      --bg-main: #000000;
      --bg-card: #000000;
      --bg-hover: #161616;
      --border-color: #27272a;
      --border-input: #3f3f46;
      --text-primary: #f4f4f5;
      --text-heading: #ffffff;
      --text-secondary: #a1a1aa;
      --btn-clear-bg: #27272a;
      --btn-clear-hover: #3f3f46;
      --btn-primary-bg: linear-gradient(135deg, #2563eb, #1d4ed8);
      --btn-primary-hover: linear-gradient(135deg, #1d4ed8, #1e40af);
      --btn-primary-shadow: rgba(37, 99, 235, 0.4);
      --input-focus-border: #3b82f6;
      --input-focus-shadow: rgba(59, 130, 246, 0.25);
      --accent-color: #3b82f6;
    }

    [data-theme="midnight"] {
      --bg-main: #0a0f1d;
      --bg-card: #0f172a;
      --bg-hover: #1e293b;
      --border-color: #1e293b;
      --border-input: #334155;
      --text-primary: #e2e8f0;
      --text-heading: #93c5fd;
      --text-secondary: #94a3b8;
      --btn-clear-bg: #1e293b;
      --btn-clear-hover: #334155;
      --btn-primary-bg: linear-gradient(135deg, #0284c7, #0369a1);
      --btn-primary-hover: linear-gradient(135deg, #0369a1, #075985);
      --btn-primary-shadow: rgba(2, 132, 199, 0.35);
      --input-focus-border: #38bdf8;
      --input-focus-shadow: rgba(56, 189, 248, 0.2);
      --accent-color: #38bdf8;
    }

    [data-theme="cyberpunk"] {
      --bg-main: #0f0a1c;
      --bg-card: #181028;
      --bg-hover: #291b42;
      --border-color: #3b2860;
      --border-input: #523884;
      --text-primary: #f5efff;
      --text-heading: #f472b6;
      --text-secondary: #a78bfa;
      --btn-clear-bg: #3b2860;
      --btn-clear-hover: #523884;
      --btn-primary-bg: linear-gradient(135deg, #ec4899, #8b5cf6);
      --btn-primary-hover: linear-gradient(135deg, #db2777, #7c3aed);
      --btn-primary-shadow: rgba(236, 72, 153, 0.35);
      --input-focus-border: #ec4899;
      --input-focus-shadow: rgba(236, 72, 153, 0.25);
      --accent-color: #ec4899;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg-main: #18191a;
        --bg-card: #242526;
        --bg-hover: #333538;
        --border-color: #383a3d;
        --border-input: #44474b;
        --text-primary: #e4e6eb;
        --text-heading: #ffffff;
        --text-secondary: #b0b3b8;
        --btn-clear-bg: #44474b;
        --btn-clear-hover: #55585d;
        --btn-primary-bg: linear-gradient(135deg, #2563eb, #1d4ed8);
        --btn-primary-hover: linear-gradient(135deg, #1d4ed8, #1e40af);
        --btn-primary-shadow: rgba(37, 99, 235, 0.35);
        --input-focus-border: #3b82f6;
        --input-focus-shadow: rgba(59, 130, 246, 0.25);
        --accent-color: #3b82f6;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      padding: 10px 14px;
      width: 740px;
      background: var(--bg-main);
      color: var(--text-primary);
      transition: background-color 0.2s, color 0.2s;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .header h1 {
      font-size: 15px;
      color: var(--text-heading);
      font-weight: 700;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .group-tabs-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }

    .group-tabs-label:hover {
      color: var(--text-primary);
    }

    .group-tabs-label input[type="checkbox"] {
      cursor: pointer;
      width: 12px;
      height: 12px;
      accent-color: var(--accent-color);
      margin: 0;
    }

    .theme-control {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .theme-label {
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }

    .theme-select {
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .theme-select:focus {
      border-color: var(--input-focus-border);
    }
    
    .search-section {
      margin-bottom: 8px;
    }
    
    .input-group {
      position: relative;
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    
    #query {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-input);
      border-radius: 6px;
      font-size: 13px;
      background: var(--bg-card);
      color: var(--text-primary);
      transition: border-color 0.2s;
    }
    
    #query:focus {
      outline: none;
      border-color: var(--input-focus-border);
      box-shadow: 0 0 0 3px var(--input-focus-shadow);
    }
    
    .clear-btn {
      padding: 8px 14px;
      background: var(--btn-clear-bg);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background-color 0.2s;
    }
    
    .clear-btn:hover {
      background: var(--btn-clear-hover);
    }
    
    .engines-section {
      margin-bottom: 8px;
    }
    
    .section-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .select-all-controls {
      display: flex;
      gap: 6px;
    }
    
    .select-all-btn, .clear-all-btn {
      padding: 3px 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .select-all-btn:hover {
      background: var(--bg-hover);
    }
    
    .clear-all-btn:hover {
      background: var(--bg-hover);
      color: #dc3545;
    }
    
    .selected-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 8px;
      margin-bottom: 6px;
    }

    .selected-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .selected-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .selected-badge {
      background: var(--accent-color);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      line-height: 1.2;
    }

    .selected-hint {
      font-size: 10px;
      font-weight: 400;
      color: var(--text-secondary);
      text-transform: none;
      letter-spacing: normal;
      opacity: 0.8;
    }

    .filter-toggle-btn {
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-toggle-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent-color);
    }

    .filter-toggle-btn.active {
      background: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .selected-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 56px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-input) transparent;
      padding: 1px 0;
    }

    .selected-chips::-webkit-scrollbar {
      width: 4px;
    }

    .selected-chips::-webkit-scrollbar-thumb {
      background: var(--border-input);
      border-radius: 2px;
    }

    .selected-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-hover);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1px 7px 1px 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .selected-chip:hover {
      background: rgba(220, 53, 69, 0.12);
      border-color: #dc3545;
      color: #dc3545;
    }

    .selected-chip .chip-icon {
      width: 13px;
      height: 13px;
      border-radius: 2px;
      object-fit: contain;
    }

    .selected-chip .chip-remove {
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      opacity: 0.6;
      margin-left: 2px;
    }

    .selected-chip:hover .chip-remove {
      opacity: 1;
    }

    .selected-chips-empty {
      font-size: 11px;
      font-style: italic;
      color: var(--text-secondary);
      padding: 2px 0;
    }

    .engines-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px 6px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 8px;
      background: var(--bg-card);
      margin-bottom: 6px;
      max-height: 380px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-input) transparent;
    }

    .engines-grid::-webkit-scrollbar {
      width: 6px;
    }

    .engines-grid::-webkit-scrollbar-thumb {
      background: var(--border-input);
      border-radius: 3px;
    }
    
    .engine-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background-color 0.15s;
    }
    
    .engine-item:hover {
      background: var(--bg-hover);
    }
    
    .engine-item input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      accent-color: var(--accent-color);
    }
    
    .engine-item label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      min-width: 0;
      user-select: none;
      color: var(--text-primary);
    }

    .engine-icon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .engine-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .engine-category {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 5px;
      margin-bottom: 2px;
      border-bottom: 1.5px solid var(--border-color);
      padding-bottom: 2px;
      user-select: none;
    }

    .engine-category:first-child {
      margin-top: 0;
    }

    .category-title-text {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-heading);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      cursor: pointer;
      transition: color 0.15s;
    }

    .category-title-text:hover {
      color: var(--accent-color);
    }

    .category-controls {
      display: flex;
      gap: 4px;
    }

    .cat-action-btn {
      padding: 1px 6px;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: none;
      letter-spacing: normal;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.3;
    }

    .cat-action-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--accent-color);
    }

    .cat-action-btn.cat-clear:hover {
      color: #dc3545;
      border-color: #dc3545;
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .search-btn {
      padding: 10px;
      background: var(--btn-primary-bg);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
      position: relative;
    }
    
    .search-btn:hover:not(:disabled) {
      background: var(--btn-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px var(--btn-primary-shadow);
    }
    
    .search-btn:disabled {
      background: var(--border-input);
      color: var(--text-secondary);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .search-btn.loading {
      background: var(--btn-clear-bg);
    }
    
    .search-btn.loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    
    .status {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      min-height: 16px;
    }
    
    .status.success {
      color: #28a745;
    }
    
    .status.error {
      color: #dc3545;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Multi-Engine Search Pro</h1>
    <div class="header-controls">
      <label class="group-tabs-label" title="Group search result tabs into a named Chrome Tab Group">
        <input type="checkbox" id="groupTabsCheckbox" checked>
        <span>Group Tabs</span>
      </label>
      <div class="theme-control">
        <label for="themeSelect" class="theme-label" title="Select Theme">🎨</label>
        <select id="themeSelect" class="theme-select" title="Theme">
          <option value="system">Auto (System)</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="oled">OLED Dark</option>
          <option value="midnight">Midnight Blue</option>
          <option value="cyberpunk">Cyberpunk</option>
        </select>
      </div>
    </div>
  </div>

  <div class="search-section">
    <div class="input-group">
      <input type="text" id="query" placeholder="Enter search term..." />
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="selected-panel" id="selectedPanel">
    <div class="selected-header">
      <div class="selected-title">
        <span>Active Engines</span>
        <span class="selected-badge" id="selectedCountBadge">0</span>
        <span class="selected-hint">Click chip to remove</span>
      </div>
      <button class="filter-toggle-btn" id="filterToggleBtn" title="Filter list below to only checked engines">Filter: Show Selected Only</button>
    </div>
    <div class="selected-chips" id="selectedChips"></div>
  </div>

  <div class="engines-section">
    <div class="section-title">
      <span>Select Search Engines</span>
      <div class="select-all-controls">
        <button class="select-all-btn" id="selectAllBtn">Select All</button>
        <button class="clear-all-btn" id="clearAllBtn">Clear All</button>
      </div>
    </div>
    
    <div class="engines-grid" id="enginesGrid">
      <div class="engine-category">
        <span class="category-title-text">General Search</span>
        <div class="category-controls">
          <button type="button" class="cat-action-btn cat-select" title="Select all General Search engines">Select All</button>
          <button type="button" class="cat-action-btn cat-clear" title="Clear all General Search engines">Clear</button>
        </div>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="google" value="google">
        <label for="google">
          <img class="engine-icon" src="icons/engines/google.ico" alt="">
          <span class="engine-name">Google</span>
        </label>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="bing" value="bing">
        <label for="bing">
          <img class="engine-icon" src="icons/engines/bing.ico" alt="">
          <span class="engine-name">Bing</span>
        </label>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="duckduckgo" value="duckduckgo">
        <label for="duckduckgo">
          <img class="engine-icon" src="icons/engines/duckduckgo.ico" alt="">
          <span class="engine-name">DuckDuckGo</span>
        </label>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="brave" value="brave">
        <label for="brave">
          <img class="engine-icon" src="icons/engines/brave.ico" alt="">
          <span class="engine-name">Brave</span>
        </label>
      </div>
      
      <div class="engine-category">
        <span class="category-title-text">Privacy-Focused</span>
        <div class="category-controls">
          <button type="button" class="cat-action-btn cat-select" title="Select all Privacy-Focused engines">Select All</button>
          <button type="button" class="cat-action-btn cat-clear" title="Clear all Privacy-Focused engines">Clear</button>
        </div>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="startpage" value="startpage">
        <label for="startpage">
          <img class="engine-icon" src="icons/engines/startpage.ico" alt="">
          <span class="engine-name">Startpage</span>
        </label>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="qwant" value="qwant">
        <label for="qwant">
          <img class="engine-icon" src="icons/engines/qwant.ico" alt="">
          <span class="engine-name">Qwant</span>
        </label>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="mojeek" value="mojeek">
        <label for="mojeek">
          <img class="engine-icon" src="icons/engines/mojeek.ico" alt="">
          <span class="engine-name">Mojeek</span>
        </label>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="presearch" value="presearch">
        <label for="presearch">
          <img class="engine-icon" src="icons/engines/presearch.ico" alt="">
          <span class="engine-name">Presearch</span>
        </label>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="kagi" value="kagi">
        <label for="kagi">
          <img class="engine-icon" src="icons/engines/kagi.ico" alt="">
          <span class="engine-name">Kagi</span>
        </label>
      </div>

      <div class="engine-category">
        <span class="category-title-text">Academic & Research</span>
        <div class="category-controls">
          <button type="button" class="cat-action-btn cat-select" title="Select all Academic & Research engines">Select All</button>
          <button type="button" class="cat-action-btn cat-clear" title="Clear all Academic & Research engines">Clear</button>
        </div>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="google_scholar" value="google_scholar">
        <label for="google_scholar">
          <img class="engine-icon" src="icons/engines/google_scholar.ico" alt="">
          <span class="engine-name">Google Scholar</span>
        </label>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="arxiv" value="arxiv">
        <label for="arxiv">
          <img class="engine-icon" src="icons/engines/arxiv.ico" alt="">
          <span class="engine-name">arXiv</span>
        </label>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="semantic_scholar" value="semantic_scholar">
        <label for="semantic_scholar">
          <img class="engine-icon" src="icons/engines/semantic_scholar.ico" alt="">
          <span class="engine-name">Semantic Scholar</span>
        </label>
      </div>
      <div class="engine-item">
        <input type="checkbox" id="scihub" value="scihub">
